    <style>
        *{margin:0;padding:0;box-sizing:border-box}
        body{

            color:#1c1e21;

        }

            z-index:-1;
        }

            padding:22px;
            margin-bottom:16px;
            box-shadow:0 12px 32px rgba(0,0,0,0.22);
            width:100%;
        }
        .welcome-card{text-align:center;padding:35px 22px;}
        .welcome-card .logo-icon{

            margin:0 auto 18px;font-size:3rem;

        .welcome-card p{color:#444;margin:15px 0;line-height:1.7;font-size:0.95rem;}

        .welcome-stat .stat-num{font-size:1.6rem;font-weight:bold;color:#1a237e;}
        .welcome-stat .stat-lbl{font-size:0.7rem;color:#888;margin-top:4px;}
        .btn-primary{
            background:linear-gradient(135deg,#1a237e,#3949ab);

        .btn-secondary{

            position:fixed;top:0;left:0;width:100%;height:100%;

            background:#fff;border-radius:28px;padding:22px;width:92%;

        .quiz-content h3{color:#1a237e;margin-bottom:6px;text-align:center;font-size:1.1rem;}

        .quiz-option.correct{border-color:#2e7d32;background:#c8e6c9!important;animation:pulse 0.5s;}
        .quiz-option.wrong{border-color:#c62828;background:#ffcdd2!important;animation:shake 0.5s;}
        .tf-btns{display:flex;gap:16px;justify-content:center;margin:18px 0;}
        .tf-btn{

        .tf-btn.false-btn{background:#ffebee;color:#c62828;border-color:#ffcdd2;}

        .tf-btn.false-btn.selected{background:#c62828;color:#fff;border-color:#c62828;}
        .tf-btn.correct-highlight{background:#2e7d32!important;color:#fff!important;border-color:#2e7d32!important;animation:pulse 0.5s;}
        .tf-btn.wrong-highlight{background:#c62828!important;color:#fff!important;border-color:#c62828!important;animation:shake 0.5s;}
        .feedback-icon{text-align:center;font-size:2.8rem;margin:10px 0;animation:popIn 0.4s ease;}
        @keyframes pulse{0%{transform:scale(1)}50%{transform:scale(1.03)}100%{transform:scale(1)}}
        @keyframes shake{0%,100%{transform:translateX(0)}20%,60%{transform:translateX(-6px)}40%,80%{transform:translateX(6px)}}
        @keyframes popIn{0%{transform:scale(0);opacity:0}100%{transform:scale(1);opacity:1}}
        .note{text-align:center;font-size:0.7rem;color:#ddd;margin-top:18px;text-shadow:0 1px 3px rgba(0,0,0,0.5);}

        .back-link button{background:none;border:none;color:#c9a96e;text-decoration:underline;font-size:0.9rem;cursor:pointer;}
    </style>
</head>

        {type:"yesno",q:"هل تدربت على قراءة الأبيات بصوت واضح؟"}
    ]},
    {id:"qasaid-matar",name:"قصيدة أنشودة المطر",icon:"🌧️",category:"قصائد",totalPoints:4,questions:[
        {type:"yesno",q:"هل حفظت المقطع المطلوب من القصيدة؟"},
        {type:"yesno",q:"هل فهمت الفكرة العامة للمقطع؟"},
        {type:"yesno",q:"هل راجعت اسم الشاعر؟"},
        {type:"yesno",q:"هل تستطيع إكمال الأبيات دون النظر للكتاب؟"}
    ]}
];

function loadProgress(){const r=localStorage.getItem('arabic_progress_v4');return r?JSON.parse(r):{completed:{}};}
function saveProgress(d){localStorage.setItem('arabic_progress_v4',JSON.stringify(d));}
function isSectionDone(id){const p=loadProgress();return !!p.completed[id];}
function getSectionScore(id){const p=loadProgress();return p.completed[id]||0;}
function markSectionDone(id,score){const p=loadProgress();p.completed[id]=score;saveProgress(p);}
function markSectionUndone(id){const p=loadProgress();delete p.completed[id];saveProgress(p);}
function getTotalEarned(){const p=loadProgress();let s=0;for(const k in p.completed)s+=p.completed[k];return s;}
function getTotalPossible(){return sectionsData.reduce((a,b)=>a+b.totalPoints,0);}
function getCompletedCount(){return Object.keys(loadProgress().completed).length;}
function getGradeText(score,total){const pct=score/total;if(pct>=0.9)return'🏆 ممتاز';if(pct>=0.7)return'👍 جيد جداً';if(pct>=0.5)return'✅ جيد';return'📚 يحتاج مراجعة';}

function createBarChart(sections){
    let html='<div class="bar-chart">';
    sections.forEach(sec=>{
        const score=getSectionScore(sec.id);
        const max=sec.totalPoints;
        const pct=(score/max)*100;
        const height=Math.max(2,(pct/100)*110);
        html+=`<div class="bar-col"><div class="bar-fill-container"><div class="bar-fill" style="height:${height}px;"></div></div><div class="bar-label">${sec.icon}</div><div class="bar-value">${score}/${max}</div></div>`;
    });
    html+='</div>';
    return html;
}

function showWelcome(){
    const total=getTotalPossible(),earned=getTotalEarned(),done=getCompletedCount();
    document.getElementById('app').innerHTML=`
        <div class="glass-card welcome-card">
            <div class="logo-icon">📚</div><h1>أهلًا ${userName}! 👋</h1>
            <p>مرحبًا بك في <strong>متابعة مادة اللغة العربية</strong><br>اختبر فهمك عبر اختبارات شاملة لكل أقسام المادة.</p>
            <div class="welcome-stats">
                <div class="welcome-stat"><div class="stat-num">${sectionsData.length}</div><div class="stat-lbl">قسم</div></div>
                <div class="welcome-stat"><div class="stat-num">${total}</div><div class="stat-lbl">درجة كليّة</div></div>
                <div class="welcome-stat"><div class="stat-num">${done}</div><div class="stat-lbl">مكتمل</div></div>
                <div class="welcome-stat"><div class="stat-num">${earned}</div><div class="stat-lbl">نقطة مكتسبة</div></div>
            </div>
            <button class="btn-primary" onclick="startApp()">✨ ابدأ المتابعة</button>
        </div>`;
}

function renderMainPage(){
    const total=getTotalPossible(),earned=getTotalEarned(),pct=Math.round((earned/total)*100);
    const grade=getGradeText(earned,total),doneCount=getCompletedCount();
    const sectionsHtml=sectionsData.map(sec=>{
        const done=isSectionDone(sec.id),score=getSectionScore(sec.id);
        return`<div class="section-card ${done?'completed':''}" style="background:${done?'rgba(232,245,233,0.95)':'rgba(255,255,255,0.85)'};" onclick="${done?`retrySection('${sec.id}')`:`startSection('${sec.id}')`}">
            <div class="sec-left"><div class="sec-icon" style="background:${done?'#c8e6c9':'#e8eaf6'};">${sec.icon}</div><div><div class="sec-name">${sec.name}</div><div class="sec-meta">${sec.category} • ${sec.totalPoints} نقطة</div></div></div>
            <span class="sec-badge ${done?'badge-done':'badge-start'}">${done?`✅ ${score}/${sec.totalPoints}`:'📝 ابدأ'}</span>
        </div>`;
    }).join('');
    document.getElementById('app').innerHTML=`
        <div class="user-row"><img src="${userPhoto}" alt=""><div><div class="user-name">${userName}</div><div class="user-handle">@${user?.username||'لا يوجد'}</div></div></div>
        <div class="glass-card" style="text-align:center;">
            <h2>📊 تقدّمك في المادة</h2>
            ${createBarChart(sectionsData)}
            <div style="margin-top:12px;font-size:1rem;font-weight:bold;color:#1a237e;">${earned} / ${total} نقطة (${pct}%)</div>
            <div style="font-size:0.9rem;color:#555;">${grade}</div>
            <div style="margin-top:8px;font-size:0.8rem;color:#888;">${doneCount} من ${sectionsData.length} أقسام مكتملة</div>
        </div>
        <div class="glass-card"><h2>📋 أقسام المادة</h2><div class="sections-grid">${sectionsHtml}</div></div>
        <div class="back-link"><button onclick="showWelcome()">⬅️ العودة لصفحة الترحيب</button></div>
        <div class="note">تطبيق تيليجرام المصغر • متابعة مادة اللغة العربية</div>`;
}

window.startApp=function(){if(!localStorage.getItem('arabic_welcome_v4'))localStorage.setItem('arabic_welcome_v4','true');renderMainPage();};
window.retrySection=function(id){if(confirm('هل تريد إعادة هذا القسم؟ سيتم حذف نتيجتك السابقة.')){markSectionUndone(id);renderMainPage();startSection(id);}};

let currentQuiz=null;
function removeModal(){const m=document.querySelector('.quiz-modal');if(m)m.remove();}
function cancelQuiz(){removeModal();currentQuiz=null;}

window.startSection=function(id){
    const sec=sectionsData.find(s=>s.id===id);if(!sec)return;
    currentQuiz={sectionId:id,questions:[...sec.questions],currentIndex:0,answers:new Array(sec.questions.length).fill(null),quizDone:false,sectionName:sec.name,totalPoints:sec.totalPoints};
    renderModal();
};

function renderModal(){
    if(!currentQuiz)return;
    const q=currentQuiz.questions[currentQuiz.currentIndex];
    const chosen=currentQuiz.answers[currentQuiz.currentIndex];
    const canCheck=chosen!==null;
    let answerArea='';
    if(q.type==='mcq')answerArea=q.opts.map((opt,idx)=>`<label class="quiz-option ${chosen===idx?'selected':''}" data-oi="${idx}"><input type="radio" name="qz" style="display:none;">${opt}</label>`).join('');
    else if(q.type==='tf')answerArea=`<div class="tf-btns"><button class="tf-btn true-btn ${chosen===true?'selected':''}" id="trueBtn">✓ صح</button><button class="tf-btn false-btn ${chosen===false?'selected':''}" id="falseBtn">✗ خطأ</button></div>`;
    else if(q.type==='yesno')answerArea=`<div class="tf-btns"><button class="tf-btn true-btn ${chosen===true?'selected':''}" id="trueBtn">👍 نعم</button><button class="tf-btn false-btn ${chosen===false?'selected':''}" id="falseBtn">👎 لا</button></div>`;

    const modal=document.createElement('div');modal.className='quiz-modal';
    modal.innerHTML=`<div class="quiz-content"><h3>${currentQuiz.sectionName}</h3><div class="q-type-label">سؤال ${currentQuiz.currentIndex+1} / ${currentQuiz.questions.length}</div><div class="q-text">${q.q}</div>${answerArea}<div style="display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-top:8px;">${currentQuiz.currentIndex>0?'<button class="btn-secondary" id="prevBtnQ">⬅️ السابق</button>':''}<button class="btn-primary" id="checkBtnQ" ${!canCheck?'disabled':''}>تحقق</button></div><div id="feedbackAreaQ"></div><button style="margin-top:12px;width:100%;background:#eee;" class="btn-secondary" onclick="cancelQuiz();renderMainPage();">إلغاء</button></div>`;
    document.body.appendChild(modal);

    if(q.type==='mcq')modal.querySelectorAll('.quiz-option').forEach(o=>o.addEventListener('click',()=>selectAnswer(parseInt(o.dataset.oi))));
    else{const tb=modal.querySelector('#trueBtn'),fb=modal.querySelector('#falseBtn');if(tb)tb.addEventListener('click',()=>selectAnswer(true));if(fb)fb.addEventListener('click',()=>selectAnswer(false));}
    modal.querySelector('#checkBtnQ').addEventListener('click',()=>{if(!currentQuiz.quizDone)checkAnswer();});
    const pb=modal.querySelector('#prevBtnQ');if(pb)pb.addEventListener('click',prevQuestion);
}

function selectAnswer(val){
    if(!currentQuiz||currentQuiz.quizDone)return;
    currentQuiz.answers[currentQuiz.currentIndex]=val;
    const modal=document.querySelector('.quiz-modal');if(!modal)return;
    const q=currentQuiz.questions[currentQuiz.currentIndex];
    if(q.type==='mcq'){modal.querySelectorAll('.quiz-option').forEach(o=>o.classList.remove('selected'));const s=modal.querySelector(`.quiz-option[data-oi="${val}"]`);if(s)s.classList.add('selected');}
    else{const tb=modal.querySelector('#trueBtn'),fb=modal.querySelector('#falseBtn');if(tb)tb.classList.remove('selected');if(fb)fb.classList.remove('selected');if(val===true&&tb)tb.classList.add('selected');if(val===false&&fb)fb.classList.add('selected');}
    const cb=modal.querySelector('#checkBtnQ');if(cb)cb.disabled=false;
}

function checkAnswer(){
    if(!currentQuiz||currentQuiz.quizDone)return;
    const q=currentQuiz.questions[currentQuiz.currentIndex],chosen=currentQuiz.answers[currentQuiz.currentIndex];
    if(chosen===null||chosen===undefined)return;
    let isCorrect;if(q.type==='mcq')isCorrect=(chosen===q.correct-1);else if(q.type==='tf')isCorrect=(chosen===q.answer);else isCorrect=true;
    currentQuiz.quizDone=true;
    const modal=document.querySelector('.quiz-modal');if(!modal)return;
    if(q.type==='mcq')modal.querySelectorAll('.quiz-option').forEach((o,idx)=>{o.style.pointerEvents='none';if(idx===q.correct-1)o.classList.add('correct');else if(idx===chosen&&!isCorrect)o.classList.add('wrong');});
    else{const tb=modal.querySelector('#trueBtn'),fb=modal.querySelector('#falseBtn');if(tb)tb.style.pointerEvents='none';if(fb)fb.style.pointerEvents='none';if(q.type==='tf'){const cv=q.answer;if(cv===true&&tb)tb.classList.add('correct-highlight');if(cv===false&&fb)fb.classList.add('correct-highlight');if(!isCorrect){if(chosen===true&&tb)tb.classList.add('wrong-highlight');if(chosen===false&&fb)fb.classList.add('wrong-highlight');}}else{if(chosen===true&&tb)tb.classList.add('correct-highlight');if(chosen===false&&fb)fb.classList.add('correct-highlight');}}
    const fa=modal.querySelector('#feedbackAreaQ');fa.innerHTML=isCorrect||q.type==='yesno'?'<div class="feedback-icon">✅</div><p style="text-align:center;color:#2e7d32;">تم التسجيل!</p>':'<div class="feedback-icon">❌</div><p style="text-align:center;color:#c62828;">الإجابة الصحيحة: '+(q.type==='mcq'?q.opts[q.correct-1]:q.answer?'✓ صح':'✗ خطأ')+'</p>';
    if(isCorrect||q.type==='yesno')createConfetti(modal.querySelector('.quiz-content'));
    const cb=modal.querySelector('#checkBtnQ');if(cb)cb.style.display='none';
    const prev=modal.querySelector('#prevBtnQ');if(prev)prev.style.display='none';
    const isLast=currentQuiz.currentIndex===currentQuiz.questions.length-1;
    const nb=document.createElement('button');nb.className='btn-primary';nb.textContent=isLast?'إنهاء الاختبار':'التالي ⏩';
    nb.addEventListener('click',isLast?finishQuiz:moveNext);cb.parentNode.appendChild(nb);
}

function moveNext(){removeModal();currentQuiz.currentIndex++;currentQuiz.quizDone=false;renderModal();}
function prevQuestion(){removeModal();currentQuiz.currentIndex--;currentQuiz.quizDone=false;renderModal();}

function finishQuiz(){
    // حفظ المراجع قبل الحذف
    const quizRef=currentQuiz;
    let score=0;
    quizRef.questions.forEach((q,i)=>{
        const chosen=quizRef.answers[i];
        if(q.type==='mcq'){if(chosen===q.correct-1)score++;}
        else if(q.type==='tf'){if(chosen===q.answer)score++;}
        else{if(chosen===true)score++;}
    });
    const total=quizRef.questions.length;
    const scaledScore=Math.round((score/total)*quizRef.totalPoints);
    // إزالة المودال أولاً
    removeModal();
    // حفظ النتيجة
    markSectionDone(quizRef.sectionId,scaledScore);
    currentQuiz=null;
    const pct=Math.round((scaledScore/quizRef.totalPoints)*100);
    alert(`📊 نتيجة ${quizRef.sectionName}:\n${scaledScore} / ${quizRef.totalPoints} نقطة (${pct}%)\nإجابات صحيحة: ${score} من ${total}`);
    renderMainPage();
}

function createConfetti(c){const colors=['#ff0','#f00','#0f0','#00f','#ff00ff','#00ffff','#c9a96e','#1a237e'];for(let i=0;i<25;i++){const d=document.createElement('div');d.style.cssText=`position:absolute;width:8px;height:8px;background:${colors[Math.floor(Math.random()*colors.length)]};left:${Math.random()*100}%;top:-10px;border-radius:50%;animation:confettiFall ${1+Math.random()}s ease forwards;`;c.appendChild(d);setTimeout(()=>d.remove(),2000);}}
const st=document.createElement('style');st.textContent='@keyframes confettiFall{0%{transform:translateY(0)rotate(0deg);opacity:1}100%{transform:translateY(200px)rotate(720deg);opacity:0}}';document.head.appendChild(st);

if(localStorage.getItem('arabic_welcome_v4')){renderMainPage();}else{showWelcome();}
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>🧬 Physiology Lectures - TMA</title>
    <script src="https://telegram.org/js/telegram-web-app.js">
    </script>
    <style>
        :root {
            --bg: #0b0c17;
            --surface: #151724;
            --surface2: #1e2132;
            --primary: #6c63ff;
            --primary-glow: #8f88ff;
            --accent: #00d4aa;
            --gold: #ffb800;
            --text: #e9e9f0;
            --text2: #b0b0c8;
            --danger: #ff5e5e;
            --success: #4ade80;
            --radius: 18px;
            --radius-sm: 12px;
            --shadow: 0 4px 24px rgba(0,0,0,0.5);
            --shadow-glow: 0 0 30px rgba(108,99,255,0.3);
            --transition: 0.3s cubic-bezier(0.4,0,0.2,1);
            --font: 'Segoe UI', 'SF Pro', 'Helvetica Neue', sans-serif;
        }
        *{margin:0;padding:0;box-sizing:border-box;}
        body{
            font-family:var(--font);
            background:var(--bg);
            color:var(--text);
            min-height:100vh;
            overflow-x:hidden;
            -webkit-tap-highlight-color:transparent;
            user-select:none;
            background-image:
                radial-gradient(ellipse at 30% 20%, rgba(108,99,255,0.12) 0%, transparent 60%),
                radial-gradient(ellipse at 70% 80%, rgba(0,212,170,0.08) 0%, transparent 60%),
                radial-gradient(ellipse at 50% 50%, rgba(255,184,0,0.04) 0%, transparent 70%);
            background-attachment:fixed;
        }
        ::-webkit-scrollbar{width:4px;}::-webkit-scrollbar-track{background:transparent;}::-webkit-scrollbar-thumb{background:var(--surface2);border-radius:10px;}

        .particles{position:fixed;top:0;left:0;width:100%;height:100%;pointer-events:none;z-index:0;}
        .particle{position:absolute;border-radius:50%;animation:floatUp linear infinite;opacity:0;}
        @keyframes floatUp{0%{transform:translateY(105vh) scale(0);opacity:0;}10%{opacity:0.7;}90%{opacity:0.1;}100%{transform:translateY(-10vh) scale(1.4);opacity:0;}}

        .app-container{position:relative;z-index:1;max-width:520px;margin:0 auto;padding:16px 14px 40px;min-height:100vh;}
        .app-header{text-align:center;padding:20px 10px 16px;}
        .app-header .logo-icon{font-size:52px;display:block;animation:bounce 2s ease-in-out infinite;filter:drop-shadow(0 8px 20px rgba(108,99,255,0.5));}
        @keyframes bounce{0%,100%{transform:translateY(0);}30%{transform:translateY(-12px);}50%{transform:translateY(0);}70%{transform:translateY(-5px);}}
        .app-header h1{font-size:1.6rem;font-weight:800;margin-top:6px;background:linear-gradient(135deg,var(--primary-glow),var(--accent),var(--gold));-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;letter-spacing:-0.3px;}
        .app-header .subtitle{font-size:0.85rem;color:var(--text2);margin-top:2px;}

        .overall-progress{background:var(--surface);border-radius:var(--radius);padding:18px 16px;margin:8px 0 18px;border:1px solid rgba(255,255,255,0.06);box-shadow:var(--shadow);position:relative;overflow:hidden;}
        .overall-progress::after{content:'';position:absolute;top:-30px;right:-30px;width:80px;height:80px;background:var(--primary);border-radius:50%;filter:blur(40px);opacity:0.3;z-index:0;}
        .overall-progress .progress-header{display:flex;justify-content:space-between;align-items:center;position:relative;z-index:1;}
        .overall-progress .progress-label{font-weight:700;font-size:0.95rem;}
        .overall-progress .progress-pct{font-weight:800;font-size:1.3rem;color:var(--accent);}
        .progress-bar-outer{width:100%;height:10px;background:var(--surface2);border-radius:20px;margin-top:10px;overflow:hidden;position:relative;z-index:1;}
        .progress-bar-inner{height:100%;background:linear-gradient(90deg,var(--primary),var(--accent),var(--gold));border-radius:20px;transition:width 0.7s cubic-bezier(0.4,0,0.2,1);width:0%;box-shadow:0 0 16px rgba(108,99,255,0.5);}
        .stats-row{display:flex;gap:12px;margin-top:10px;position:relative;z-index:1;font-size:0.78rem;color:var(--text2);}
        .stats-row span{background:var(--surface2);padding:5px 10px;border-radius:20px;font-weight:600;}
        .stats-row .stat-val{color:var(--gold);}

        .sections-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;}
        @media(max-width:380px){.sections-grid{grid-template-columns:1fr;}}

        .section-card{background:var(--surface);border-radius:var(--radius);padding:16px 14px;cursor:pointer;border:1.5px solid transparent;transition:all var(--transition);position:relative;overflow:hidden;box-shadow:var(--shadow);display:flex;flex-direction:column;gap:8px;min-height:130px;}
        .section-card:hover{border-color:var(--primary);transform:translateY(-3px);box-shadow:var(--shadow-glow);}
        .section-card:active{transform:scale(0.96);transition:transform 0.12s ease;}
        .section-card .card-icon{font-size:2rem;transition:transform var(--transition);}
        .section-card:hover .card-icon{transform:scale(1.2) rotate(-8deg);}
        .section-card .card-title{font-weight:700;font-size:0.9rem;line-height:1.3;color:var(--text);}
        .section-card .card-meta{font-size:0.72rem;color:var(--text2);}
        .section-card .card-badge{display:inline-flex;align-items:center;gap:4px;padding:4px 10px;border-radius:20px;font-size:0.7rem;font-weight:700;background:var(--surface2);color:var(--text2);transition:all var(--transition);}
        .section-card.completed .card-badge{background:rgba(74,222,128,0.15);color:var(--success);}
        .section-card .mini-progress{width:100%;height:4px;background:var(--surface2);border-radius:10px;overflow:hidden;margin-top:auto;}
        .section-card .mini-progress-fill{height:100%;border-radius:10px;background:var(--accent);transition:width 0.5s ease;width:0%;}
        .section-card.completed .mini-progress-fill{background:var(--success);width:100%;}
        .section-card.completed{border-color:rgba(74,222,128,0.3);}
        .section-card .score-text{font-size:0.7rem;font-weight:700;color:var(--gold);}

        .quiz-overlay{position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,0.85);z-index:100;display:flex;align-items:center;justify-content:center;animation:fadeIn 0.25s ease;backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);}
        @keyframes fadeIn{from{opacity:0;}to{opacity:1;}}
        .quiz-modal{background:var(--surface);border-radius:22px;width:92%;max-width:480px;max-height:88vh;overflow-y:auto;padding:20px 16px 24px;box-shadow:0 20px 50px rgba(0,0,0,0.6);animation:slideUp 0.35s cubic-bezier(0.22,0.61,0.36,1);position:relative;border:1px solid rgba(255,255,255,0.08);}
        @keyframes slideUp{from{transform:translateY(50px);opacity:0;}to{transform:translateY(0);opacity:1;}}
        .quiz-modal .quiz-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:16px;position:sticky;top:0;background:var(--surface);padding-bottom:10px;z-index:2;}
        .quiz-modal .quiz-title{font-weight:800;font-size:1.05rem;line-height:1.3;}
        .quiz-modal .close-btn{width:36px;height:36px;border-radius:50%;background:var(--surface2);border:none;color:var(--text);font-size:1.2rem;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:all var(--transition);}
        .quiz-modal .close-btn:hover{background:var(--danger);color:#fff;transform:rotate(90deg);}

        .key-points-toggle{background:var(--surface2);border-radius:var(--radius-sm);padding:12px 14px;margin-bottom:14px;cursor:pointer;display:flex;align-items:center;gap:8px;font-weight:600;font-size:0.9rem;transition:all var(--transition);border:1px solid transparent;}
        .key-points-toggle:hover{border-color:var(--primary);}
        .key-points-list{list-style:none;padding:0;margin:10px 0 0;display:none;font-size:0.8rem;color:var(--text2);line-height:1.6;}
        .key-points-list.visible{display:block;animation:fadeIn 0.3s ease;}
        .key-points-list li{padding:6px 0;border-bottom:1px solid rgba(255,255,255,0.05);}

        .q-progress{display:flex;gap:5px;margin-bottom:18px;flex-wrap:wrap;}
        .q-dot{width:22px;height:22px;border-radius:50%;background:var(--surface2);font-size:0.6rem;display:flex;align-items:center;justify-content:center;font-weight:700;transition:all var(--transition);color:var(--text2);}
        .q-dot.current{background:var(--primary);color:#fff;box-shadow:0 0 14px rgba(108,99,255,0.6);animation:pulse 1.3s ease-in-out infinite;}
        .q-dot.correct-dot{background:var(--success);color:#000;}
        .q-dot.wrong-dot{background:var(--danger);color:#fff;}
        @keyframes pulse{0%,100%{box-shadow:0 0 14px rgba(108,99,255,0.6);}50%{box-shadow:0 0 28px rgba(108,99,255,0.9);}}

        .question-card{background:var(--surface2);border-radius:var(--radius-sm);padding:20px 16px;margin-bottom:14px;border:1px solid rgba(255,255,255,0.05);animation:fadeIn 0.3s ease;text-align:center;font-size:1rem;font-weight:600;line-height:1.6;min-height:80px;display:flex;align-items:center;justify-content:center;transition:all var(--transition);}
        .question-card.correct-flash{border-color:var(--success)!important;box-shadow:0 0 24px rgba(74,222,128,0.35)!important;background:rgba(74,222,128,0.08)!important;}
        .question-card.wrong-flash{border-color:var(--danger)!important;box-shadow:0 0 24px rgba(255,94,94,0.35)!important;background:rgba(255,94,94,0.08)!important;}

        .btn-row{display:flex;gap:12px;margin-bottom:10px;}
        .btn-tf{flex:1;padding:15px 10px;border-radius:var(--radius-sm);border:2px solid rgba(255,255,255,0.1);font-size:1rem;font-weight:700;cursor:pointer;transition:all var(--transition);background:var(--surface);color:var(--text);}
        .btn-tf:hover{border-color:var(--primary);box-shadow:0 0 20px rgba(108,99,255,0.3);}
        .btn-tf:active{transform:scale(0.94);}
        .btn-tf.selected-true{border-color:var(--success)!important;background:rgba(74,222,128,0.15)!important;color:var(--success)!important;}
        .btn-tf.selected-false{border-color:var(--danger)!important;background:rgba(255,94,94,0.15)!important;color:var(--danger)!important;}
        .btn-tf:disabled{opacity:0.5;pointer-events:none;}

        .explanation{background:rgba(255,184,0,0.08);border-radius:var(--radius-sm);padding:12px 14px;font-size:0.82rem;color:var(--gold);font-weight:500;line-height:1.5;animation:fadeIn 0.4s ease;border-left:3px solid var(--gold);}

        .nav-btns{display:flex;gap:10px;margin-top:6px;}
        .nav-btn{flex:1;padding:12px;border-radius:25px;border:none;font-weight:700;cursor:pointer;transition:all var(--transition);font-size:0.9rem;}
        .nav-btn.next-btn{background:var(--primary);color:#fff;}
        .nav-btn.finish-btn{background:var(--accent);color:#000;}
        .nav-btn.retry-btn{background:var(--surface2);color:var(--text);border:1px solid rgba(255,255,255,0.2);}

        .results-container{text-align:center;animation:fadeIn 0.5s ease;}
        .results-container .big-score{font-size:5rem;font-weight:900;background:linear-gradient(135deg,var(--accent),var(--gold));-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;line-height:1;}
        .results-container .score-label{font-size:1rem;color:var(--text2);margin:4px 0 16px;}
        .results-container .star-row{font-size:2.5rem;letter-spacing:4px;margin:10px 0;}
        .star-lit{color:var(--gold);animation:starPop 0.5s ease forwards;display:inline-block;}
        .star-dim{color:#444;display:inline-block;}
        @keyframes starPop{0%{transform:scale(0) rotate(-30deg);opacity:0;}60%{transform:scale(1.5) rotate(10deg);opacity:1;}100%{transform:scale(1) rotate(0);opacity:1;}}

        .confetti-piece{position:fixed;z-index:200;pointer-events:none;animation:confettiFall linear forwards;}
        @keyframes confettiFall{0%{transform:translateY(-120px) rotate(0deg) scale(1);opacity:1;}100%{transform:translateY(105vh) rotate(720deg) scale(0.3);opacity:0;}}

        @media(min-width:500px){.sections-grid{grid-template-columns:1fr 1fr 1fr;}.app-container{padding:20px 20px 50px;}}
    </style>
</head>
<body>
<div class="particles" id="particles"></div>

<div class="app-container" id="appContainer">
    <div class="app-header">
        <span class="logo-icon">🧬</span>
        <h1>Physiology Lectures</h1>
        <p class="subtitle">GIT · Urinary · Temperature · Lung · Blood</p>
    </div>
    <div class="overall-progress" id="overallProgress">
        <div class="progress-header">
            <span class="progress-label">📊 Overall Progress</span>
            <span class="progress-pct" id="overallPct">0%</span>
        </div>
        <div class="progress-bar-outer"><div class="progress-bar-inner" id="overallBar"></div></div>
        <div class="stats-row">
            <span>✅ Completed: <b class="stat-val" id="statCompleted">0</b></span>
            <span>📝 Total: <b class="stat-val">6</b></span>
            <span>⭐ Avg: <b class="stat-val" id="statAvg">-</b></span>
        </div>
    </div>
    <div class="sections-grid" id="sectionsGrid"></div>
</div>

<div class="quiz-overlay" id="quizOverlay" style="display:none;">
    <div class="quiz-modal" id="quizModal"></div>
</div>

<script>
(function(){
const tg = window.Telegram?.WebApp;
if(tg){ tg.ready(); tg.expand(); tg.setHeaderColor('#0b0c17'); tg.setBackgroundColor('#0b0c17'); if(tg.BackButton) tg.BackButton.onClick(() => closeQuiz()); }

// Floating particles
const particlesContainer = document.getElementById('particles');
const pColors = ['#6c63ff','#00d4aa','#ffb800','#ff5e5e','#4ade80','#8f88ff','#ffffff'];
for(let i=0;i<35;i++){
    const p=document.createElement('div'); p.classList.add('particle');
    const size=Math.random()*5+2; p.style.width=size+'px'; p.style.height=size+'px';
    p.style.left=Math.random()*100+'%'; p.style.backgroundColor=pColors[Math.floor(Math.random()*pColors.length)];
    p.style.animationDuration=(Math.random()*14+8)+'s'; p.style.animationDelay=(Math.random()*12)+'s';
    p.style.boxShadow=`0 0 ${size*3}px ${p.style.backgroundColor}`;
    particlesContainer.appendChild(p);
}

// ─────────────────── DATA ───────────────────
const sectionsData = [
{
    id:1, icon:'🫁', title:'GI Anatomy & Function', subtitle:'Gastrointestinal System',
    points:[
        "The GI tract is a long muscular tube extending ~9 m from mouth to anus.",
        "Accessory organs: teeth, tongue, salivary glands, liver, pancreas.",
        "Four main functions: ingestion, digestion, absorption, excretion.",
        "Saliva: 1.0–1.5 L/day; contains buffers, mucins, salivary amylase.",
        "Stomach regions: fundus, body, antrum, pylorus.",
        "Parietal cells secrete intrinsic factor (B12) and HCl.",
        "Chief cells produce pepsinogen → pepsin (pH 1.5–2.0) for protein digestion.",
        "Small intestine: duodenum, jejunum, ileum; longest segment.",
        "Ileocecal valve: sphincter controlling flow from ileum to cecum.",
        "Liver produces bile (fat emulsification); gallbladder stores it."
    ],
    questions:[
        {statement:"The stomach has only two muscular layers.",answer:false,explanation:"False. It has three muscular layers."},
        {statement:"The large intestine is approximately 6 feet long and absorbs water and electrolytes.",answer:true,explanation:""},
        {statement:"The pancreas produces enzymes like trypsinogen and lipase.",answer:true,explanation:""},
        {statement:"The small intestine mucosa has villi, but not microvilli.",answer:false,explanation:"False. It has villi, and each villus has multiple microvilli."},
        {statement:"The main function of the esophagus is to transport food via peristalsis.",answer:true,explanation:""}
    ]
},
{
    id:2, icon:'🧪', title:'Digestion & Absorption', subtitle:'Biochemistry',
    points:[
        "Digestion: breakdown of food into particles small enough to cross the GI barrier.",
        "Absorption: transport of digested products into blood or lymph.",
        "Absorption mechanisms: simple diffusion, active transport, facilitated & passive transport.",
        "Carbohydrate chemical digestion begins in the mouth via amylase.",
        "Starch broken by amylase; sugars by lactase, sucrase, maltase.",
        "Proteins digested in stomach by pepsin (HCl-activated) and later by small intestine proteases.",
        "Lipids are hydrophobic; emulsified by bile salts then broken by pancreatic lipase.",
        "Small intestine responsible for 90% of absorption.",
        "GI tract absorbs ~9 L water/day.",
        "Amino acids absorbed into bloodstream via active transport."
    ],
    questions:[
        {statement:"Proteins are digested into amino acids in the mouth.",answer:false,explanation:"False. They are digested in the stomach and small intestine."},
        {statement:"Pancreatic lipase breaks down fats into free fatty acids and monoglycerides.",answer:true,explanation:""},
        {statement:"Only 2 liters of water are ingested daily, but the body absorbs 9 liters from secretions.",answer:true,explanation:""},
        {statement:"Fats are water-soluble and do not require bile salts for digestion.",answer:false,explanation:"False. Fats are hydrophobic and require bile salts for emulsification."},
        {statement:"The chemical digestion of carbohydrates begins in the stomach.",answer:false,explanation:"False. It begins in the mouth."}
    ]
},
{
    id:3, icon:'💧', title:'Urinary System', subtitle:'Kidneys & Nephrons',
    points:[
        "Urinary system: kidneys, ureters, urinary bladder, urethra.",
        "Kidneys are retroperitoneal (T12–L3).",
        "Functional unit: nephron (renal corpuscle + renal tubule).",
        "Renal corpuscle: glomerulus + Bowman's capsule.",
        "Ureters carry urine via peristalsis every 10–15 s.",
        "Bladder stores urine; surrounded by prostate in males.",
        "Urethra has two sphincters: internal (involuntary) and external (voluntary).",
        "Urine formation steps: Glomerular filtration, Reabsorption, Secretion.",
        "Glomerular filtration: ultrafiltration; all plasma constituents except proteins pass into Bowman's capsule.",
        "Urine composition: 95% water, 5% nitrogenous wastes (urea, ammonia, creatinine)."
    ],
    questions:[
        {statement:"The kidneys produce the hormone erythropoietin.",answer:true,explanation:""},
        {statement:"Tubular secretion involves adding substances like hydrogen and potassium ions into the filtrate.",answer:true,explanation:""},
        {statement:"The adrenal glands sit on the inferior pole of each kidney.",answer:false,explanation:"False. They sit on the superior pole."},
        {statement:"99% of the filtrate is reabsorbed by the renal tubules.",answer:true,explanation:""},
        {statement:"The female urethra is longer than the male urethra.",answer:false,explanation:"False. The female urethra is much shorter."}
    ]
},
{
    id:4, icon:'🌡️', title:'Body Temperature', subtitle:'Thermoregulation',
    points:[
        "Normal body temperature: 36°C–37°C.",
        "Hypothalamus is the thermoregulation center.",
        "Peripheral thermoreceptors in skin; central in viscera, spinal cord, hypothalamus.",
        "Lowest temperature at 4 AM, highest at 6 PM.",
        "Efferent responses: behavioral adjustments (shade, warmth).",
        "Vasodilation → heat loss; vasoconstriction & shivering → heat conservation/generation.",
        "Fever: body temperature ≥38°C (100.4°F).",
        "Hyperthermia: unregulated high temperature, normal hypothalamic set-point.",
        "Hypothermia: involuntary drop in core temperature below 35°C (95°F).",
        "During menstruation, average body temperature is at its minimum."
    ],
    questions:[
        {statement:"The hypothalamus regulates body temperature by comparing current temperature to a set-point of 37°C.",answer:true,explanation:""},
        {statement:"A high fever is defined as any temperature above 41°C.",answer:false,explanation:"False. High fever is above 39.5°C; very high fever is above 41°C."},
        {statement:"During menstruation, the average body temperature is at its maximum.",answer:false,explanation:"False. It is at its minimum."},
        {statement:"Heat stroke involves a temperature >40°C with dry, hot skin and CNS abnormalities.",answer:true,explanation:""},
        {statement:"Impaired thermoregulation is a leading cause of hypothermia.",answer:true,explanation:""}
    ]
},
{
    id:5, icon:'🫧', title:'Lung Volumes & Capacities', subtitle:'Spirometry',
    points:[

        "Tidal Volume (TV): ~500 mL, normal quiet respiration.",
        "Inspiratory Reserve Volume (IRV): ~3300 mL, extra after normal inspiration.",
        "Expiratory Reserve Volume (ERV): ~1000 mL, extra after normal expiration.",
        "Residual Volume (RV): ~1200 mL, remains after forced expiration; prevents lung collapse.",
        "Vital Capacity (VC) = TV + IRV + ERV.",
        "Total Lung Capacity (TLC) = VC + RV.",
        "Functional Residual Capacity (FRC) = ERV + RV.",

        "Minute Volume = Tidal Volume × Respiratory Rate (~6 L/min)."
    ],
    questions:[
        {statement:"Residual Volume (RV) can be directly measured by a standard spirometer.",answer:false,explanation:"False. RV cannot be measured by spirometry alone."},
        {statement:"Inspiratory Capacity (IC) equals TV + IRV.",answer:true,explanation:""},
        {statement:"PEFR is useful for diagnosing and monitoring asthma.",answer:true,explanation:""},
        {statement:"Vital Capacity (VC) includes the Residual Volume.",answer:false,explanation:"False. VC = TV+IRV+ERV; RV is not included."},
        {statement:"PEFR in a healthy adult female is approximately 450 L/min.",answer:true,explanation:""}
    ]
},
{
    id:6, icon:'🩸', title:'Hormones & Blood Practical', subtitle:'BT, CT, Grouping, Urine',
    points:[
        "Endocrine secretion: hormones into blood to distant targets (e.g., insulin).",
        "Paracrine: acts on nearby cells (e.g., histamine); Autocrine: acts on same cell (e.g., cytokines).",
        "Bleeding Time (BT): assesses platelet function; normal 1–7 min.",
        "Clotting Time (CT): assesses intrinsic pathway; normal 4–10 min.",
        "Blood groups: based on A, B, D (Rh) antigens.",
        "Universal Recipient: AB; Universal Donor: O.",
        "Urine volume abnormalities: Anuria <100 mL/d, Oliguria <400 mL/d, Polyuria >3000 mL/d.",
        "Urine dipstick detects: protein, glucose, ketones, blood, pH, bilirubin, urobilinogen, nitrite, leukocytes.",
        "Microscopy: casts (hyaline, RBC, WBC, granular), crystals (calcium oxalate, uric acid, triple phosphate).",
        "Triple phosphate crystals have a 'coffin lid' shape."
    ],
    questions:[
        {statement:"Prolonged Bleeding Time (BT) is primarily associated with hemophilia.",answer:false,explanation:"False. Hemophilia mainly prolongs Clotting Time (CT); BT is more associated with platelet disorders."},
        {statement:"The blood group with no antigens on RBCs is Type O.",answer:true,explanation:""},
        {statement:"Glucose in urine (Glycosuria) is always caused by diabetes mellitus.",answer:false,explanation:"False. It can be caused by renal glycosuria, pregnancy, stress, or SGLT2 inhibitors."},
        {statement:"Triple phosphate crystals have a 'coffin lid' shape.",answer:true,explanation:""},
        {statement:"RBC casts in urine sediment are specific for glomerulonephritis.",answer:true,explanation:""}
    ]
}
];

// ─────────── STORAGE ───────────
const STORAGE_KEY = 'physiology_progress_v1';
function loadProgress(){ try{ const d=localStorage.getItem(STORAGE_KEY); return d ? JSON.parse(d) : {}; }catch(e){ return {}; } }
function saveProgress(p){ try{ localStorage.setItem(STORAGE_KEY, JSON.stringify(p)); }catch(e){} }
let progressData = loadProgress();

function getSectionProgress(id){ return progressData[id] || null; }
function setSectionProgress(id, score, total){ progressData[id] = { score, total, completed:true, timestamp:Date.now() }; saveProgress(progressData); }
function resetSectionProgress(id){ delete progressData[id]; saveProgress(progressData); }

function getOverallStats(){
    const ids = Object.keys(progressData).filter(k => progressData[k]?.completed);
    const completedCount = ids.length;
    const totalSections = sectionsData.length;
    const pct = totalSections ? Math.round((completedCount/totalSections)*100) : 0;
    let avg = null;
    if(completedCount){
        const totalScore = ids.reduce((s,k)=> s + progressData[k].score, 0);
        const totalQs = ids.reduce((s,k)=> s + progressData[k].total, 0);
        avg = totalQs ? Math.round((totalScore/totalQs)*100) : 0;
    }
    return { completedCount, totalSections, pct, avgScore: avg };
}

function renderDashboard(){
    const grid = document.getElementById('sectionsGrid');
    grid.innerHTML = '';
    sectionsData.forEach((sec, idx) => {
        const prog = getSectionProgress(sec.id);
        const isCompleted = prog?.completed;
        const score = prog?.score;
        const card = document.createElement('div');
        card.className = 'section-card' + (isCompleted ? ' completed' : '');
        card.setAttribute('data-section-id', sec.id);
        card.style.animationDelay = (idx*0.04) + 's';
        card.style.animation = 'fadeIn 0.5s ease forwards';
        card.style.opacity = '0';
        card.innerHTML = `
        <span class="card-icon">${sec.icon}</span>
        <span class="card-title">${sec.title}</span>
        <span class="card-meta">${sec.subtitle}</span>
        <div class="mini-progress"><div class="mini-progress-fill" style="width:${isCompleted?'100%':'0%'}"></div></div>
        <div style="display:flex;align-items:center;justify-content:space-between;">
          <span class="card-badge"><span class="badge-dot"></span> ${isCompleted ? 'Done' : 'Start'}</span>
          ${isCompleted && score!==null ? `<span class="score-text">⭐ ${score}/5</span>` : ''}
        </div>`;
        card.addEventListener('click', () => openQuiz(sec));
        grid.appendChild(card);
        requestAnimationFrame(() => { card.style.opacity = '1'; });
    });
    updateOverallStats();
}

function updateOverallStats(){
    const stats = getOverallStats();
    document.getElementById('overallPct').textContent = stats.pct + '%';
    document.getElementById('overallBar').style.width = stats.pct + '%';
    document.getElementById('statCompleted').textContent = stats.completedCount;
    document.getElementById('statAvg').textContent = stats.avgScore !== null ? stats.avgScore + '%' : '-';
}

// ─────────── QUIZ LOGIC ───────────
let currentSection = null, currentQIndex = 0, userAnswers = [], answeredFlags = [];

function openQuiz(section){
    if(tg?.BackButton) tg.BackButton.show();
    currentSection = section;
    currentQIndex = 0;
    userAnswers = new Array(section.questions.length).fill(null);
    answeredFlags = new Array(section.questions.length).fill(false);
    renderQuiz();
    document.getElementById('quizOverlay').style.display = 'flex';
    document.body.style.overflow = 'hidden';
}

function closeQuiz(){
    if(tg?.BackButton) tg.BackButton.hide();
    document.getElementById('quizOverlay').style.display = 'none';
    document.body.style.overflow = '';
    currentSection = null; currentQIndex = 0; userAnswers = []; answeredFlags = [];
    renderDashboard();
}

function toggleKeyPoints(){
    const list = document.getElementById('keyPointsList');
    if(list) list.classList.toggle('visible');
}

function renderQuiz(){
    if(!currentSection) return;
    const sec = currentSection;
    const q = sec.questions[currentQIndex];
    const isAnswered = answeredFlags[currentQIndex];
    const selected = userAnswers[currentQIndex];

    let dots = '';
    for(let i=0; i<sec.questions.length; i++){
        let cls = 'q-dot';
        if(i === currentQIndex && !answeredFlags[i]) cls += ' current';
        if(answeredFlags[i] && userAnswers[i] === sec.questions[i].answer) cls += ' correct-dot';
        if(answeredFlags[i] && userAnswers[i] !== null && userAnswers[i] !== sec.questions[i].answer) cls += ' wrong-dot';
        dots += `<div class="${cls}">${i+1}</div>`;
    }

    let cardClass = 'question-card';
    if(isAnswered) cardClass += (selected === q.answer) ? ' correct-flash' : ' wrong-flash';

    const isLast = currentQIndex === sec.questions.length-1;
    const allDone = answeredFlags.every(a => a === true);

    const modal = document.getElementById('quizModal');
    modal.innerHTML = `
    <div class="quiz-header">
      <span class="quiz-title">${sec.icon} ${sec.title}</span>
      <button class="close-btn" onclick="window.closeQuiz()">✕</button>
    </div>
    <div class="key-points-toggle" onclick="window.toggleKeyPoints()">
      📋 10 Must-Know Points (tap to expand)
    </div>
    <ul class="key-points-list" id="keyPointsList">
      ${sec.points.map(p => `<li>• ${p}</li>`).join('')}
    </ul>
    <div class="q-progress">${dots}</div>
    <div class="${cardClass}">${q.statement}</div>
    <div class="btn-row">
      <button class="btn-tf ${selected===true?'selected-true':''}" ${isAnswered?'disabled':''} onclick="window.answerQuestion(true)">✅ True</button>
      <button class="btn-tf ${selected===false?'selected-false':''}" ${isAnswered?'disabled':''} onclick="window.answerQuestion(false)">❌ False</button>
    </div>
    ${isAnswered && !q.answer && q.explanation ? `<div class="explanation">💡 ${q.explanation}</div>` : ''}
    ${isAnswered && q.answer ? '<div style="color:var(--success);font-weight:700;text-align:center;margin:6px 0;">✅ Correct!</div>' : ''}
    ${isAnswered && !q.answer ? '<div style="color:var(--danger);font-weight:700;text-align:center;margin:6px 0;">❌ Incorrect</div>' : ''}
    <div class="nav-btns">
      ${isAnswered && !isLast ? `<button class="nav-btn next-btn" onclick="window.nextQuestion()">Next →</button>` : ''}
      ${isAnswered && isLast ? `<button class="nav-btn finish-btn" onclick="window.finishQuiz()">🏁 Show Results</button>` : ''}
      ${!isAnswered ? `<button class="nav-btn retry-btn" onclick="window.skipQuestion()" style="flex:0.5;font-size:0.75rem;">Skip ⏭</button>` : ''}
    </div>
    ${allDone && isLast && isAnswered ? `<div style="text-align:center;margin-top:8px;"><button class="nav-btn finish-btn" onclick="window.finishQuiz()" style="width:100%;">🏁 Show Final Results</button></div>` : ''}
    `;
}

function answerQuestion(ans){
    if(!currentSection || answeredFlags[currentQIndex]) return;
    userAnswers[currentQIndex] = ans;
    answeredFlags[currentQIndex] = true;
    const q = currentSection.questions[currentQIndex];
    if(tg?.HapticFeedback){
        tg.HapticFeedback.notificationOccurred(ans === q.answer ? 'success' : 'error');
    }
    renderQuiz();
}

function nextQuestion(){
    if(!currentSection || currentQIndex >= currentSection.questions.length-1) return;
    currentQIndex++;
    renderQuiz();
    document.getElementById('quizModal').scrollTop = 0;
}

function skipQuestion(){
    if(!currentSection || answeredFlags[currentQIndex]) return;
    userAnswers[currentQIndex] = null;
    answeredFlags[currentQIndex] = true;
    if(currentQIndex < currentSection.questions.length-1){
        currentQIndex++;
        renderQuiz();
    } else {
        renderQuiz();
    }
}

function finishQuiz(){
    if(!currentSection) return;
    const sec = currentSection;
    let correct = 0;
    for(let i=0; i<sec.questions.length; i++){
        if(userAnswers[i] === sec.questions[i].answer) correct++;
    }
    setSectionProgress(sec.id, correct, sec.questions.length);
    const pct = Math.round((correct/5)*100);
    let emoji = '😢';
    if(pct >= 100) emoji = '🏆';
    else if(pct >= 80) emoji = '🌟';
    else if(pct >= 60) emoji = '👍';
    else if(pct >= 40) emoji = '📖';

    const stars = Array.from({length:5}, (_,i) => i<correct ? 'star-lit' : 'star-dim');
    const modal = document.getElementById('quizModal');
    modal.innerHTML = `
    <div class="quiz-header"><span class="quiz-title">${sec.icon} ${sec.title}</span><button class="close-btn" onclick="window.closeQuiz()">✕</button></div>
    <div class="results-container">
      <div style="font-size:3rem;">${emoji}</div>
      <div class="big-score">${correct}/5</div>
      <div class="score-label">Correct answers</div>
      <div class="star-row">${stars.map((s,i) => `<span class="${s}" style="animation-delay:${i*0.12}s;">⭐</span>`).join('')}</div>
      <p style="color:var(--text2);margin:12px 0;">Percentage: <b style="color:var(--accent);">${pct}%</b></p>
      <div class="btn-row">
        <button class="nav-btn retry-btn" onclick="window.retryQuiz()">🔄 Retry</button>
        <button class="nav-btn finish-btn" onclick="window.closeQuiz()">✅ Done</button>
      </div>
    </div>`;
    if(pct >= 80) spawnConfetti();
    if(pct === 100) setTimeout(spawnConfetti, 600);
    updateOverallStats();
    if(tg?.HapticFeedback) tg.HapticFeedback.notificationOccurred('success');
}

function retryQuiz(){
    if(!currentSection) return;
    resetSectionProgress(currentSection.id);
    userAnswers = new Array(currentSection.questions.length).fill(null);
    answeredFlags = new Array(currentSection.questions.length).fill(false);
    currentQIndex = 0;
    renderQuiz();
    updateOverallStats();
}

function spawnConfetti(){
    const confettiColors = ['#ffb800','#ff5e5e','#4ade80','#6c63ff','#00d4aa','#ff69b4','#ffd000','#00bfff'];
    for(let i=0; i<60; i++){
        const piece = document.createElement('div'); piece.classList.add('confetti-piece');
        piece.style.left = Math.random()*100+'%';
        piece.style.top = -(Math.random()*80+20)+'px';
        piece.style.width = (Math.random()*10+5)+'px';
        piece.style.height = (Math.random()*10+5)+'px';
        piece.style.backgroundColor = confettiColors[Math.floor(Math.random()*confettiColors.length)];
        piece.style.borderRadius = Math.random()>0.5 ? '50%' : '2px';
        piece.style.animationDuration = (Math.random()*2+1.8)+'s';
        piece.style.animationDelay = Math.random()*0.6+'s';
        document.body.appendChild(piece);
        setTimeout(() => piece.remove(), 3000);
    }
}

// Expose functions globally for onclick
window.closeQuiz = closeQuiz;
window.toggleKeyPoints = toggleKeyPoints;
window.answerQuestion = answerQuestion;
window.nextQuestion = nextQuestion;
window.skipQuestion = skipQuestion;
window.finishQuiz = finishQuiz;
window.retryQuiz = retryQuiz;

// Close on Esc or overlay click
document.addEventListener('keydown', e => { if(e.key === 'Escape' && currentSection) closeQuiz(); });
document.getElementById('quizOverlay').addEventListener('click', function(e){ if(e.target === this) closeQuiz(); });

// Initial render
renderDashboard();
const initStats = getOverallStats();
if(initStats.completedCount === initStats.totalSections && initStats.totalSections > 0){
    setTimeout(() => { spawnConfetti(); setTimeout(spawnConfetti, 700); }, 500);
}
})();
</script>
</body>
</html>

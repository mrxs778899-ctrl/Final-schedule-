<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>

    <title>الأجهزة والتقنيات المختبرية</title>

    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;

            min-height: 100vh;
            background: url('https://images.unsplash.com/photo-1562774053-701939374585?ixlib=rb-4.0.3&auto=format&fit=crop&w=1920&q=80') no-repeat center center fixed;
            background-size: cover;
            position: relative;
        }
        body::before {
            content: '';
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0, 0, 0, 0.45);
            z-index: -1;
        }
        .container {
            max-width: 500px;
            margin: 0 auto;
            padding: 20px;
            position: relative;
            z-index: 1;
        }
        .glass-card {
            background: rgba(255, 255, 255, 0.92);
            backdrop-filter: blur(15px);
            border-radius: 24px;
            padding: 20px;
            margin-bottom: 16px;
            box-shadow: 0 12px 30px rgba(0,0,0,0.25);
            width: 100%;
        }
        .welcome-card { text-align: center; padding: 30px 20px; }
        .welcome-card img { width: 90px; height: 90px; border-radius: 50%; border: 3px solid #0088cc; margin-bottom: 15px; }
        .welcome-card h1 { font-size: 1.7rem; color: #0d47a1; margin-bottom: 8px; }
        .welcome-card p { color: #444; margin: 15px 0; line-height: 1.6; }
        .btn-primary {
            background: #0088cc; color: #fff; border: none; padding: 12px 25px; border-radius: 30px;
            font-size: 0.95rem; font-weight: bold; cursor: pointer; transition: transform 0.2s, background 0.2s;
            box-shadow: 0 6px 15px rgba(0,136,204,0.4); margin: 3px; text-align: center;
        }
        .btn-primary:active { transform: scale(0.96); background: #005f8a; }
        .btn-secondary {
            background: #e0e0e0; color: #333; border: none; padding: 10px 18px; border-radius: 30px;
            font-size: 0.85rem; font-weight: bold; cursor: pointer; transition: 0.2s; margin: 3px;
        }
        .btn-secondary:active { background: #bdbdbd; }
        .user { display: flex; align-items: center; gap: 12px; margin-bottom: 20px; }
        .user img { width: 48px; height: 48px; border-radius: 50%; border: 2px solid #0088cc; }
        h2 { font-size: 1.3rem; margin-bottom: 12px; color: #0d47a1; }
        .chart-container { display: flex; justify-content: center; margin: 10px 0 15px; }
        .lecture-list { margin-top: 15px; }
        .lecture-item {
            display: flex; align-items: center; justify-content: space-between;
            background: rgba(255,255,255,0.7); border-radius: 14px; padding: 10px 14px;
            margin-bottom: 8px; flex-wrap: wrap; gap: 8px;
        }
        .lecture-info { display: flex; align-items: center; gap: 8px; }
        .lecture-info .status { font-weight: bold; }
        .lecture-buttons { display: flex; gap: 6px; }
        /* نماذج الاختبار */
        .quiz-modal {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.7); display: flex; align-items: center; justify-content: center; z-index: 999;
        }
        .quiz-content {
            background: #fff; border-radius: 24px; padding: 20px; width: 90%;
            max-width: 500px; max-height: 85vh; overflow-y: auto; box-shadow: 0 20px 40px rgba(0,0,0,0.4);
            position: relative;
        }
        .quiz-content h3 { color: #0d47a1; margin-bottom: 15px; text-align: center; }
        .quiz-option {
            display: block; background: #f5f5f5; border: 2px solid transparent; border-radius: 12px;
            padding: 12px; margin: 8px 0; cursor: pointer; transition: 0.2s; text-align: right;
        }
        .quiz-option.selected { border-color: #0088cc; background: #e3f2fd; }
        .quiz-option.correct { border-color: #2e7d32; background: #c8e6c9; animation: correctPulse 0.5s; }
        .quiz-option.wrong { border-color: #d32f2f; background: #ffcdd2; animation: shake 0.5s; }
        .quiz-btn {
            background: #0088cc; color: #fff; border: none; padding: 12px; border-radius: 12px;
            width: 100%; font-weight: bold; margin-top: 12px; cursor: pointer;
        }
        .quiz-btn:disabled { opacity: 0.5; }
        .feedback-icon { text-align: center; font-size: 2.5rem; margin: 10px 0; animation: popIn 0.4s ease; }
        @keyframes correctPulse {
            0% { transform: scale(1); } 50% { transform: scale(1.02); } 100% { transform: scale(1); }
        }
        @keyframes shake {
            0%,100% { transform: translateX(0); }
            20%,60% { transform: translateX(-5px); }
            40%,80% { transform: translateX(5px); }
        }
        @keyframes popIn {
            0% { transform: scale(0); opacity: 0; } 100% { transform: scale(1); opacity: 1; }
        }
        .note { text-align: center; font-size: 0.7rem; color: #ddd; margin-top: 16px; text-shadow: 0 1px 3px rgba(0,0,0,0.5); }
        .back-link { text-align: center; margin-top: 10px; }
        .back-link button { background: none; border: none; color: #0088cc; text-decoration: underline; font-size: 0.9rem; cursor: pointer; }
    </style>
</head>

        // --- دوال localStorage ---
        function loadProgress() {
            const raw = localStorage.getItem('lab_progress_v6');
            return raw ? JSON.parse(raw) : { completed: [] };
        }
        function saveProgress(data) { localStorage.setItem('lab_progress_v6', JSON.stringify(data)); }
        function isWelcomeShown() { return localStorage.getItem('lab_welcome_v6') === 'true'; }
        function setWelcomeShown() { localStorage.setItem('lab_welcome_v6', 'true'); }

        function getCompletedCount(type) {
            const progress = loadProgress();
            return progress.completed.filter(id => id.startsWith(type)).length;
        }
        function isLectureCompleted(lectureId) {
            const progress = loadProgress();
            return progress.completed.includes(lectureId);
        }
        function markLectureCompleted(lectureId) {
            const progress = loadProgress();
            if (!progress.completed.includes(lectureId)) {
                progress.completed.push(lectureId);
                saveProgress(progress);
            }
        }
        function markLectureIncomplete(lectureId) {
            const progress = loadProgress();
            progress.completed = progress.completed.filter(id => id !== lectureId);
            saveProgress(progress);
        }

            const offset = circumference - (percent / 100) * circumference;
            return `
                <svg width="140" height="140" viewBox="0 0 120 120">
                    <circle cx="60" cy="60" r="${radius}" fill="none" stroke="#e0e0e0" stroke-width="12" />
                    <circle cx="60" cy="60" r="${radius}" fill="none" stroke="#0088cc" stroke-width="12"
                            stroke-dasharray="${circumference}" stroke-dashoffset="${offset}"
                            stroke-linecap="round" transform="rotate(-90 60 60)"
                            style="transition: stroke-dashoffset 0.8s ease;" />
                    <text x="60" y="55" text-anchor="middle" fill="#0d47a1" font-size="22" font-weight="bold">${percent}%</text>
                    <text x="60" y="75" text-anchor="middle" fill="#555" font-size="12">مكتمل</text>
                </svg>
            `;
        }

        // --- الصفحة الرئيسية ---
        function renderMainPage() {
            const theoCompleted = getCompletedCount('theoretical');
            const pracCompleted = getCompletedCount('practical');
            const totalCompleted = theoCompleted + pracCompleted;
            const totalLectures = TOTAL_THEORETICAL + TOTAL_PRACTICAL;
            const pct = Math.round((totalCompleted / totalLectures) * 100);

            const theoList = [];
            for (let i = 1; i <= TOTAL_THEORETICAL; i++) {
                const id = `theoretical-${i}`;
                theoList.push({ id, name: `محاضرة ${i} نظري`, completed: isLectureCompleted(id) });
            }
            const pracList = [];
            for (let i = 1; i <= TOTAL_PRACTICAL; i++) {
                const id = `practical-${i}`;
                pracList.push({ id, name: `محاضرة ${i} عملي`, completed: isLectureCompleted(id) });
            }

            const renderLectureItem = (lecture) => `
                <div class="lecture-item">
                    <div class="lecture-info">
                        <span class="status">${lecture.completed ? '✅' : '⬜'}</span>
                        <span>${lecture.name}</span>
                    </div>
                    <div class="lecture-buttons">
                        ${lecture.completed ?
                            `<button class="btn-secondary" onclick="toggleLecture('${lecture.id}', false)">❌ إلغاء الإكمال</button>` :
                            `<button class="btn-secondary" onclick="completeLectureDirect('${lecture.id}')">✓ إكمال مباشر</button>
                             <button class="btn-primary" onclick="startQuiz('${lecture.id}')">📝 اختبار</button>`
                        }
                    </div>
                </div>
            `;

            const html = `
                <div class="user">
                    <img src="${userPhoto}" alt="">
                    <div>
                        <strong>${userName}</strong>
                        <div style="font-size:0.8rem; opacity:0.8;">@${user?.username || 'لا يوجد'}</div>
                    </div>
                </div>
                <div class="glass-card" style="text-align:center;">
                    <h2>📊 نسبة الإكمال</h2>
                    <div class="chart-container">${createDonutChart(pct)}</div>
                    <p>${totalCompleted} من ${totalLectures} محاضرة</p>
                    <div style="display:flex; justify-content:center; gap:20px; margin-top:10px;">
                        <div><strong>نظري:</strong> ${theoCompleted}/${TOTAL_THEORETICAL}</div>
                        <div><strong>عملي:</strong> ${pracCompleted}/${TOTAL_PRACTICAL}</div>
                    </div>
                </div>
                <div class="glass-card">
                    <h2>📘 المحاضرات النظرية</h2>
                    <div class="lecture-list">${theoList.map(renderLectureItem).join('')}</div>
                </div>
                <div class="glass-card">
                    <h2>🧪 المحاضرات العملية</h2>
                    <div class="lecture-list">${pracList.map(renderLectureItem).join('')}</div>
                </div>
                <div class="back-link"><button onclick="showWelcome()">⬅️ العودة لصفحة الترحيب</button></div>
                <div class="note">تطبيق تيليجرام المصغر • الأجهزة والتقنيات المختبرية</div>
            `;
            document.getElementById('app').innerHTML = html;
        }

        function showWelcome() {
            const html = `
                <div class="glass-card welcome-card">
                    <img src="${userPhoto}" alt="صورة">
                    <h1>أهلًا ${userName}! 👋</h1>
                    <p>مرحبًا بك في <strong>منظّم دراسة الأجهزة والتقنيات المختبرية</strong> 🔬</p>
                    <p>يمكنك إكمال المحاضرات مباشرة أو عبر اختبارات MCQ تفاعلية.</p>
                    <button class="btn-primary" onclick="startApp()">✨ ابدأ الآن</button>
                </div>
            `;
            document.getElementById('app').innerHTML = html;
        }

        window.startApp = function() {
            setWelcomeShown();
            renderMainPage();
        };

        window.completeLectureDirect = function(lectureId) {
            markLectureCompleted(lectureId);
            renderMainPage();
        };

        window.toggleLecture = function(lectureId, complete) {
            if (complete) markLectureCompleted(lectureId);
            else markLectureIncomplete(lectureId);
            renderMainPage();
        };

        // --- نظام الاختبار التفاعلي (بدون خروج تلقائي، مع إصلاح التنقل) ---
        let currentQuiz = null;

        // إزالة المودال فقط دون إلغاء الاختبار
        function removeQuizModal() {
            const modal = document.querySelector('.quiz-modal');
            if (modal) modal.remove();
        }

        // إلغاء الاختبار بالكامل
        function cancelQuiz() {
            removeQuizModal();
            currentQuiz = null;
        }

        window.startQuiz = function(lectureId) {
            if (isLectureCompleted(lectureId)) {
                alert('هذه المحاضرة مكتملة بالفعل. يمكنك إلغاء الإكمال ثم إعادة الاختبار.');
                return;
            }
            if (!quizData[lectureId]) {
                alert('لا توجد أسئلة لهذه المحاضرة بعد.');
                return;
            }
            currentQuiz = {
                lectureId: lectureId,
                questions: [...quizData[lectureId]],
                currentIndex: 0,
                answers: new Array(quizData[lectureId].length).fill(null),
                quizDone: false
            };
            renderQuizModal();
        };

        function renderQuizModal() {
            if (!currentQuiz) return;
            const q = currentQuiz.questions[currentQuiz.currentIndex];
            const selectedAnswer = currentQuiz.answers[currentQuiz.currentIndex];
            const canCheck = selectedAnswer !== null;

            const modal = document.createElement('div');
            modal.className = 'quiz-modal';
            modal.innerHTML = `
                <div class="quiz-content" id="quizInner">
                    <h3>سؤال ${currentQuiz.currentIndex + 1} / ${currentQuiz.questions.length}</h3>
                    <p style="margin-bottom:10px;"><strong>${q.q}</strong></p>
                    ${q.opts.map((opt, idx) => `
                        <label class="quiz-option ${selectedAnswer === idx ? 'selected' : ''}" data-option-index="${idx}">
                            <input type="radio" name="quizOpt" style="display:none;">
                            ${opt}
                        </label>
                    `).join('')}
                    <div style="display:flex; gap:10px; margin-top:15px; justify-content:center; flex-wrap:wrap;">
                        ${currentQuiz.currentIndex > 0 ? '<button class="btn-secondary" id="prevBtn">⬅️ السابق</button>' : ''}
                        <button class="btn-primary" id="checkBtn" ${!canCheck ? 'disabled' : ''}>تحقق</button>
                    </div>
                    <div id="feedbackArea"></div>
                    <button style="margin-top:12px; width:100%; background:#eee;" class="btn-secondary" onclick="cancelQuiz(); renderMainPage();">إلغاء الاختبار</button>
                </div>
            `;
            document.body.appendChild(modal);

            // ربط الأحداث
            const options = modal.querySelectorAll('.quiz-option');
            options.forEach(opt => {
                opt.addEventListener('click', (e) => {
                    const idx = parseInt(opt.dataset.optionIndex);
                    selectAnswer(idx);
                });
            });

            const checkBtn = modal.querySelector('#checkBtn');
            if (checkBtn) {
                checkBtn.addEventListener('click', () => {
                    if (!currentQuiz.quizDone) checkAnswer();
                });
            }

            const prevBtn = modal.querySelector('#prevBtn');
            if (prevBtn) {
                prevBtn.addEventListener('click', () => {
                    prevQuestion();
                });
            }
        }

        function selectAnswer(idx) {
            if (!currentQuiz || currentQuiz.quizDone) return;
            currentQuiz.answers[currentQuiz.currentIndex] = idx;
            const modal = document.querySelector('.quiz-modal');
            if (!modal) return;
            const options = modal.querySelectorAll('.quiz-option');
            options.forEach(opt => opt.classList.remove('selected'));
            const selectedOption = modal.querySelector(`.quiz-option[data-option-index="${idx}"]`);
            if (selectedOption) selectedOption.classList.add('selected');
            const checkBtn = modal.querySelector('#checkBtn');
            if (checkBtn) checkBtn.disabled = false;
        }

        function checkAnswer() {
            if (!currentQuiz || currentQuiz.quizDone) return;
            const q = currentQuiz.questions[currentQuiz.currentIndex];
            const chosen = currentQuiz.answers[currentQuiz.currentIndex];
            if (chosen === null || chosen === undefined) return;
            const correctIdx = q.correct - 1;
            const isCorrect = (chosen === correctIdx);
            currentQuiz.quizDone = true;

            const modal = document.querySelector('.quiz-modal');
            if (!modal) return;
            const options = modal.querySelectorAll('.quiz-option');
            options.forEach((opt, idx) => {
                opt.style.pointerEvents = 'none';
                if (idx === correctIdx) opt.classList.add('correct');
                else if (idx === chosen && !isCorrect) opt.classList.add('wrong');
            });

            const feedbackArea = modal.querySelector('#feedbackArea');
            if (isCorrect) {
                feedbackArea.innerHTML = '<div class="feedback-icon">✅</div><p style="text-align:center;color:#2e7d32;">إجابة صحيحة!</p>';
                createConfetti(modal.querySelector('.quiz-content'));
            } else {
                feedbackArea.innerHTML = '<div class="feedback-icon">❌</div><p style="text-align:center;color:#d32f2f;">إجابة خاطئة! الصحيح: ' + q.opts[correctIdx] + '</p>';
            }

            // إخفاء زر تحقق و زر السابق
            const checkBtn = modal.querySelector('#checkBtn');
            if (checkBtn) checkBtn.style.display = 'none';
            const prevBtn = modal.querySelector('#prevBtn');
            if (prevBtn) prevBtn.style.display = 'none';

            // إضافة زر "التالي" أو "إنهاء الاختبار"
            const isLast = currentQuiz.currentIndex === currentQuiz.questions.length - 1;
            const nextBtn = document.createElement('button');
            nextBtn.className = 'btn-primary';
            if (isLast) {
                nextBtn.textContent = 'إنهاء الاختبار';
                nextBtn.addEventListener('click', finishQuiz);
            } else {
                nextBtn.textContent = 'التالي ⏩';
                nextBtn.addEventListener('click', moveToNextQuestion);
            }
            const buttonContainer = checkBtn.parentNode;
            buttonContainer.appendChild(nextBtn);
        }

        function moveToNextQuestion() {
            // الانتقال إلى السؤال التالي دون إلغاء الاختبار
            removeQuizModal(); // إزالة المودال الحالي فقط
            currentQuiz.currentIndex++;
            currentQuiz.quizDone = false;
            renderQuizModal();
        }

        function prevQuestion() {
            removeQuizModal();
            currentQuiz.currentIndex--;
            currentQuiz.quizDone = false;
            renderQuizModal();
        }

        function finishQuiz() {
            let correct = 0;
            currentQuiz.questions.forEach((q, i) => {
                const chosen = currentQuiz.answers[i];
                if (chosen !== null && chosen === q.correct - 1) correct++;
            });
            const total = currentQuiz.questions.length;
            cancelQuiz(); // إلغاء الاختبار نهائياً
            const message = `نتيجتك: ${correct} صحيحة من ${total}\n` + (correct >= 7 ? '🎉 مبروك! لقد نجحت وتم إكمال المحاضرة.' : '😞 لم تنجح. تحتاج 7/10 على الأقل.');
            alert(message);
            if (correct >= 7) {
                markLectureCompleted(currentQuiz.lectureId);
            }
            currentQuiz = null;
            renderMainPage();
        }

        // إغلاق الاختبار من زر الإلغاء
        // نستخدم cancelQuiz مع العودة للصفحة الرئيسية (بالفعل في الزر)

        // تأثير كونفيتي بسيط
        function createConfetti(container) {
            const colors = ['#ff0','#f00','#0f0','#00f','#ff00ff','#00ffff'];
            for (let i=0; i<20; i++) {
                const confetti = document.createElement('div');
                confetti.style.position = 'absolute';
                confetti.style.width = '8px';
                confetti.style.height = '8px';
                confetti.style.backgroundColor = colors[Math.floor(Math.random()*colors.length)];
                confetti.style.left = Math.random()*100 + '%';
                confetti.style.top = '-10px';
                confetti.style.borderRadius = '50%';
                confetti.style.animation = `confettiFall ${1+Math.random()}s ease forwards`;
                container.appendChild(confetti);
                setTimeout(() => confetti.remove(), 2000);
            }
        }

        const styleSheet = document.createElement("style");
        styleSheet.textContent = `
            @keyframes confettiFall {
                0% { transform: translateY(0) rotate(0deg); opacity:1; }
                100% { transform: translateY(200px) rotate(720deg); opacity:0; }
            }
        `;
        document.head.appendChild(styleSheet);

        // بدء التطبيق
        if (isWelcomeShown()) {
            renderMainPage();
        } else {
            showWelcome();
        }
    </script>
</body>
</html>

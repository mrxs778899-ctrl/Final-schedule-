<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
    <title>متابعة مادة الامتحان - لغة إنجليزية</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            color: #1c1e21;
            min-height: 100vh;
            background: url('https://images.unsplash.com/photo-1481627834876-b7833e8f5570?ixlib=rb-4.0.3&auto=format&fit=crop&w=1920&q=80') no-repeat center center fixed;
            background-size: cover;
            position: relative;
        }
        body::before {
            content: '';
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0, 0, 0, 0.5);
            z-index: -1;
        }
        .container {
            max-width: 500px;
            margin: 0 auto;
            padding: 20px;
            position: relative;
            z-index: 1;
        }
        .glass-card {
            background: rgba(255, 255, 255, 0.93);
            backdrop-filter: blur(15px);
            border-radius: 24px;
            padding: 20px;
            margin-bottom: 16px;
            box-shadow: 0 12px 30px rgba(0,0,0,0.25);
            width: 100%;
        }
        .welcome-card { text-align: center; padding: 30px 20px; }
        .welcome-card img { width: 90px; height: 90px; border-radius: 50%; border: 3px solid #1a73e8; margin-bottom: 15px; }
        .welcome-card h1 { font-size: 1.7rem; color: #1a73e8; margin-bottom: 8px; }
        .welcome-card p { color: #444; margin: 15px 0; line-height: 1.6; }
        .btn-primary {
            background: #1a73e8; color: #fff; border: none; padding: 12px 25px; border-radius: 30px;
            font-size: 0.95rem; font-weight: bold; cursor: pointer; transition: transform 0.2s, background 0.2s;
            box-shadow: 0 6px 15px rgba(26,115,232,0.4); margin: 3px; text-align: center;
        }
        .btn-primary:active { transform: scale(0.96); background: #1557b0; }
        .btn-secondary {
            background: #e8eaed; color: #333; border: none; padding: 10px 18px; border-radius: 30px;
            font-size: 0.85rem; font-weight: bold; cursor: pointer; transition: 0.2s; margin: 3px;
        }
        .btn-secondary:active { background: #d2d4d7; }
        .user { display: flex; align-items: center; gap: 12px; margin-bottom: 20px; }
        .user img { width: 48px; height: 48px; border-radius: 50%; border: 2px solid #1a73e8; }
        h2 { font-size: 1.3rem; margin-bottom: 12px; color: #1a73e8; }
        .section-list { margin-top: 15px; }
        .section-item {
            display: flex; align-items: center; justify-content: space-between;
            background: rgba(255,255,255,0.8); border-radius: 14px; padding: 12px 16px;
            margin-bottom: 8px; flex-wrap: wrap; gap: 8px;
        }
        .section-info { display: flex; align-items: center; gap: 8px; }
        .section-info .status { font-weight: bold; }
        .section-buttons { display: flex; gap: 6px; }
        .progress-overview { margin-top: 15px; }
        .progress-bar { height: 20px; background: #e0e0e0; border-radius: 10px; overflow: hidden; margin: 8px 0; }
        .progress-fill { height: 100%; background: #1a73e8; transition: width 0.5s; }

        /* نماذج الاختبار */
        .quiz-modal {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.7); display: flex; align-items: center; justify-content: center; z-index: 999;
        }
        .quiz-content {
            background: #fff; border-radius: 24px; padding: 20px; width: 90%;
            max-width: 500px; max-height: 85vh; overflow-y: auto; box-shadow: 0 20px 40px rgba(0,0,0,0.4);
            position: relative;
        }
        .quiz-content h3 { color: #1a73e8; margin-bottom: 8px; text-align: center; }
        .quiz-content .question-text { font-size: 1.1rem; margin: 12px 0; text-align: center; font-weight: 500; }
        .true-false-btns {
            display: flex; gap: 15px; justify-content: center; margin: 20px 0;
        }
        .tf-btn {
            flex: 1; padding: 15px; border-radius: 16px; border: 3px solid transparent;
            font-size: 1.3rem; font-weight: bold; cursor: pointer; transition: all 0.2s;
            text-align: center;
        }
        .tf-btn.true-btn { background: #e6f4ea; color: #1e7e34; border-color: #c8e6c9; }
        .tf-btn.false-btn { background: #fce8e6; color: #c5221f; border-color: #f5c6cb; }
        .tf-btn.true-btn.selected { background: #1e7e34; color: #fff; border-color: #1e7e34; }
        .tf-btn.false-btn.selected { background: #c5221f; color: #fff; border-color: #c5221f; }
        .tf-btn.correct-answer { background: #1e7e34 !important; color: #fff !important; border-color: #1e7e34 !important; animation: correctPulse 0.5s; }
        .tf-btn.wrong-answer { background: #c5221f !important; color: #fff !important; border-color: #c5221f !important; animation: shake 0.5s; }
        .quiz-btn {
            background: #1a73e8; color: #fff; border: none; padding: 12px; border-radius: 12px;
            width: 100%; font-weight: bold; margin-top: 12px; cursor: pointer;
        }
        .quiz-btn:disabled { opacity: 0.5; }
        .feedback-icon { text-align: center; font-size: 2.5rem; margin: 10px 0; animation: popIn 0.4s ease; }
        @keyframes correctPulse {
            0% { transform: scale(1); } 50% { transform: scale(1.03); } 100% { transform: scale(1); }
        }
        @keyframes shake {
            0%,100% { transform: translateX(0); }
            20%,60% { transform: translateX(-5px); }
            40%,80% { transform: translateX(5px); }
        }
        @keyframes popIn {
            0% { transform: scale(0); opacity: 0; } 100% { transform: scale(1); opacity: 1; }
        }
        .note { text-align: center; font-size: 0.7rem; color: #ddd; margin-top: 16px; text-shadow: 0 1px 3px rgba(0,0,0,0.5); }
        .back-link { text-align: center; margin-top: 10px; }
        .back-link button { background: none; border: none; color: #1a73e8; text-decoration: underline; font-size: 0.9rem; cursor: pointer; }
        .total-grade { text-align: center; margin-top: 15px; padding: 15px; background: #e8f0fe; border-radius: 16px; }
    </style>
</head>
<body>
    <div class="container" id="app"></div>
    <script>
        const tg = window.Telegram.WebApp;
        tg.ready();
        tg.expand();

        const user = tg.initDataUnsafe?.user;
        const userName = user ? (user.first_name || 'مستخدم') : 'مستخدم';
        const userPhoto = user?.photo_url || `https://ui-avatars.com/api/?name=${encodeURIComponent(userName)}&background=1a73e8&color=fff`;

        // --- تعريف الأقسام (sections) ---
        const sections = [
            { id: "grammar-countable", name: "Countable & Uncountable Nouns", icon: "📚", category: "قواعد" },
            { id: "grammar-present-simple", name: "Present Simple", icon: "🕒", category: "قواعد" },
            { id: "grammar-present-cont", name: "Present Continuous", icon: "⏳", category: "قواعد" },
            { id: "grammar-past-simple", name: "Past Simple", icon: "📅", category: "قواعد" },
            { id: "crime-types", name: "أنواع الجرائم", icon: "⚖️", category: "جرائم" },
            { id: "writing-intro-routine", name: "الإنشاء (تقديم النفس + روتين)", icon: "✍️", category: "إنشاء" },
            { id: "five-sentences", name: "خمس جمل من الاختصاص", icon: "🔬", category: "جمل" },
            { id: "paragraph", name: "الباركراف العلمي", icon: "📄", category: "باركراف" }
        ];

        // --- أسئلة كل قسم ---
        const quizData = {
            "grammar-countable": [
                { q: "كلمة Book اسم معدود.", answer: true },
                { q: "كلمة Water يمكن جمعها بـ (s).", answer: false },
                { q: "نستخدم a/an مع الاسم المفرد المعدود.", answer: true },
                { q: "كلمة Rice اسم غير معدود.", answer: true },
                { q: "الصفات يمكن جمعها.", answer: false }
            ],
            "grammar-present-simple": [
                { q: "المضارع البسيط يستخدم للروتين اليومي.", answer: true },
                { q: "مع He/She/It نضيف (s) للفعل.", answer: true },
                { q: "نستخدم does مع I و You.", answer: false },
                { q: "الجملة: “She plays football.” صحيحة.", answer: true },
                { q: "المضارع البسيط يستخدم للحقائق العلمية.", answer: true }
            ],
            "grammar-present-cont": [
                { q: "المضارع المستمر يدل على حدث يحدث الآن.", answer: true },
                { q: "الصيغة الصحيحة: I am studying.", answer: true },
                { q: "نستخدم المضارع المستمر مع الحقائق الثابتة دائماً.", answer: false },
                { q: "الصيغة: She is playing صحيحة.", answer: true },
                { q: "المضارع المستمر يستخدم للأحداث المؤقتة.", answer: true }
            ],
            "grammar-past-simple": [
                { q: "الماضي البسيط يدل على حدث انتهى بالماضي.", answer: true },
                { q: "نستخدم did في السؤال.", answer: true },
                { q: "الفعل الماضي من Go هو Went.", answer: true },
                { q: "Yesterday يدل على المضارع.", answer: false },
                { q: "الجملة “I saw Ali yesterday.” صحيحة.", answer: true }
            ],
            "crime-types": [
                { q: "Theft يعني السرقة.", answer: true },
                { q: "Murder يعني قتل غير متعمد.", answer: false },
                { q: "Arson هو حرق المباني أو الممتلكات.", answer: true },
                { q: "Kidnapping يعني خطف شخص.", answer: true },
                { q: "Vandalism يعني تدمير ممتلكات الآخرين.", answer: true }
            ],
            "writing-intro-routine": [
                { q: "هل كتبت تقديم النفس؟", answer: true },
                { q: "هل كتبت الروتين اليومي؟", answer: true },
                { q: "هل استخدمت المضارع البسيط؟", answer: true },
                { q: "هل راجعت القواعد والإملاء؟", answer: true },
                { q: "هل أصبحت قادراً على كتابة الإنشاء بدون حفظ كامل؟", answer: true }
            ],
            "five-sentences": [
                { q: "هل كتبت 5 جمل كاملة؟", answer: true },
                { q: "هل جميع الجمل بالمضارع البسيط؟", answer: true },
                { q: "هل الجمل مرتبطة بالأدلة الجنائية؟", answer: true },
                { q: "هل أضفت (s) مع He/She/It؟", answer: true },
                { q: "هل راجعت الأخطاء الإملائية؟", answer: true }
            ],
            "paragraph": [
                { q: "هل كتبت باركراف من حوالي 6 أسطر؟", answer: true },
                { q: "هل اخترت موضوع علمي من الأدلة الجنائية؟", answer: true },
                { q: "هل استخدمت كلمات علمية مناسبة؟", answer: true },
                { q: "هل الكتابة واضحة ومرتبة؟", answer: true },
                { q: "هل راجعت القواعد والإملاء؟", answer: true }
            ]
        };

        // --- دوال localStorage ---
        function loadProgress() {
            const raw = localStorage.getItem('eng_progress_v1');
            return raw ? JSON.parse(raw) : { completed: [] };
        }
        function saveProgress(data) { localStorage.setItem('eng_progress_v1', JSON.stringify(data)); }
        function isWelcomeShown() { return localStorage.getItem('eng_welcome_v1') === 'true'; }
        function setWelcomeShown() { localStorage.setItem('eng_welcome_v1', 'true'); }

        function isSectionCompleted(sectionId) {
            const progress = loadProgress();
            return progress.completed.includes(sectionId);
        }
        function markSectionCompleted(sectionId) {
            const progress = loadProgress();
            if (!progress.completed.includes(sectionId)) {
                progress.completed.push(sectionId);
                saveProgress(progress);
            }
        }
        function markSectionIncomplete(sectionId) {
            const progress = loadProgress();
            progress.completed = progress.completed.filter(id => id !== sectionId);
            saveProgress(progress);
        }

        function getTotalScore() {
            const progress = loadProgress();
            // كل قسم مكتمل يمنح 5 نقاط (لأن كل قسم من 5 أسئلة)
            return progress.completed.length * 5;
        }
        function getTotalPossible() {
            return sections.length * 5; // 8 أقسام × 5 = 40
        }
        function getGradeText(score, total) {
            if (score >= 25) return 'ممتاز';
            else if (score >= 15) return 'جيد جداً';
            else if (score >= 10) return 'جيد';
            else return 'يحتاج مراجعة قوية قبل الامتحان';
        }

        // --- صفحة الترحيب ---
        function showWelcome() {
            const html = `
                <div class="glass-card welcome-card">
                    <img src="${userPhoto}" alt="صورة">
                    <h1>أهلًا ${userName}! 👋</h1>
                    <p>مرحبًا بك في <strong>متابعة مادة الامتحان - لغة إنجليزية</strong> 🇬🇧</p>
                    <p>اختبر فهمك عبر أسئلة (صح ✓ / خطأ ✗) لجميع أقسام المادة.</p>
                    <button class="btn-primary" onclick="startApp()">✨ ابدأ الآن</button>
                </div>
            `;
            document.getElementById('app').innerHTML = html;
        }

        // --- الصفحة الرئيسية ---
        function renderMainPage() {
            const completedSections = loadProgress().completed;
            const totalScore = getTotalScore();
            const totalPossible = getTotalPossible();
            const grade = getGradeText(totalScore, totalPossible);
            const pct = Math.round((completedSections.length / sections.length) * 100);

            const sectionsHtml = sections.map(section => {
                const completed = isSectionCompleted(section.id);
                return `
                    <div class="section-item">
                        <div class="section-info">
                            <span class="status">${completed ? '✅' : '⬜'}</span>
                            <span>${section.icon} ${section.name} <small style="color:#888;">(${section.category})</small></span>
                        </div>
                        <div class="section-buttons">
                            ${completed ?
                                `<button class="btn-secondary" onclick="toggleSection('${section.id}', false)">❌ إلغاء</button>` :
                                `<button class="btn-primary" onclick="startQuiz('${section.id}')">📝 اختبار</button>`
                            }
                        </div>
                    </div>
                `;
            }).join('');

            const html = `
                <div class="user">
                    <img src="${userPhoto}" alt="">
                    <div>
                        <strong>${userName}</strong>
                        <div style="font-size:0.8rem; opacity:0.8;">@${user?.username || 'لا يوجد'}</div>
                    </div>
                </div>
                <div class="glass-card">
                    <h2>📊 تقييم التقدم</h2>
                    <div class="progress-bar">
                        <div class="progress-fill" style="width:${pct}%"></div>
                    </div>
                    <p style="text-align:center;">${completedSections.length} / ${sections.length} أقسام مكتملة</p>
                    <div class="total-grade">
                        <strong>الدرجة الإجمالية: ${totalScore} / ${totalPossible}</strong><br>
                        <span style="font-size:1.2rem;">${grade}</span>
                    </div>
                </div>
                <div class="glass-card">
                    <h2>📋 أقسام المادة</h2>
                    <div class="section-list">${sectionsHtml}</div>
                </div>
                <div class="back-link"><button onclick="showWelcome()">⬅️ العودة لصفحة الترحيب</button></div>
                <div class="note">تطبيق تيليجرام المصغر • متابعة مادة الامتحان - لغة إنجليزية</div>
            `;
            document.getElementById('app').innerHTML = html;
        }

        window.startApp = function() {
            setWelcomeShown();
            renderMainPage();
        };

        window.toggleSection = function(sectionId, complete) {
            if (complete) markSectionCompleted(sectionId);
            else markSectionIncomplete(sectionId);
            renderMainPage();
        };

        // --- نظام الاختبار (صح/خطأ) ---
        let currentQuiz = null;

        function removeQuizModal() {
            const modal = document.querySelector('.quiz-modal');
            if (modal) modal.remove();
        }

        function cancelQuiz() {
            removeQuizModal();
            currentQuiz = null;
        }

        window.startQuiz = function(sectionId) {
            if (isSectionCompleted(sectionId)) {
                alert('هذا القسم مكتمل بالفعل. يمكنك إلغاء الإكمال ثم إعادة الاختبار.');
                return;
            }
            if (!quizData[sectionId]) {
                alert('لا توجد أسئلة لهذا القسم بعد.');
                return;
            }
            currentQuiz = {
                sectionId: sectionId,
                questions: [...quizData[sectionId]],
                currentIndex: 0,
                answers: new Array(quizData[sectionId].length).fill(null),
                quizDone: false
            };
            renderQuizModal();
        };

        function renderQuizModal() {
            if (!currentQuiz) return;
            const q = currentQuiz.questions[currentQuiz.currentIndex];
            const selectedAnswer = currentQuiz.answers[currentQuiz.currentIndex];

            const modal = document.createElement('div');
            modal.className = 'quiz-modal';
            modal.innerHTML = `
                <div class="quiz-content">
                    <h3>سؤال ${currentQuiz.currentIndex + 1} / ${currentQuiz.questions.length}</h3>
                    <p class="question-text">${q.q}</p>
                    <div class="true-false-btns">
                        <button class="tf-btn true-btn ${selectedAnswer === true ? 'selected' : ''}" id="trueBtn">✓ صح</button>
                        <button class="tf-btn false-btn ${selectedAnswer === false ? 'selected' : ''}" id="falseBtn">✗ خطأ</button>
                    </div>
                    <div style="display:flex; gap:10px; justify-content:center; flex-wrap:wrap;">
                        ${currentQuiz.currentIndex > 0 ? '<button class="btn-secondary" id="prevBtn">⬅️ السابق</button>' : ''}
                        <button class="btn-primary" id="checkBtn" ${selectedAnswer === null ? 'disabled' : ''}>تحقق</button>
                    </div>
                    <div id="feedbackArea"></div>
                    <button style="margin-top:12px; width:100%; background:#eee;" class="btn-secondary" onclick="cancelQuiz(); renderMainPage();">إلغاء الاختبار</button>
                </div>
            `;
            document.body.appendChild(modal);

            document.getElementById('trueBtn').addEventListener('click', () => selectAnswer(true));
            document.getElementById('falseBtn').addEventListener('click', () => selectAnswer(false));

            const checkBtn = document.getElementById('checkBtn');
            if (checkBtn) {
                checkBtn.addEventListener('click', () => {
                    if (!currentQuiz.quizDone) checkAnswer();
                });
            }

            const prevBtn = document.getElementById('prevBtn');
            if (prevBtn) {
                prevBtn.addEventListener('click', () => prevQuestion());
            }
        }

        function selectAnswer(value) {
            if (!currentQuiz || currentQuiz.quizDone) return;
            currentQuiz.answers[currentQuiz.currentIndex] = value;
            const modal = document.querySelector('.quiz-modal');
            if (!modal) return;
            const trueBtn = modal.querySelector('#trueBtn');
            const falseBtn = modal.querySelector('#falseBtn');
            const checkBtn = modal.querySelector('#checkBtn');

            trueBtn.classList.remove('selected');
            falseBtn.classList.remove('selected');

            if (value === true) trueBtn.classList.add('selected');
            else falseBtn.classList.add('selected');

            if (checkBtn) checkBtn.disabled = false;
        }

        function checkAnswer() {
            if (!currentQuiz || currentQuiz.quizDone) return;
            const q = currentQuiz.questions[currentQuiz.currentIndex];
            const chosen = currentQuiz.answers[currentQuiz.currentIndex];
            if (chosen === null || chosen === undefined) return;
            const isCorrect = (chosen === q.answer);
            currentQuiz.quizDone = true;

            const modal = document.querySelector('.quiz-modal');
            if (!modal) return;
            const trueBtn = modal.querySelector('#trueBtn');
            const falseBtn = modal.querySelector('#falseBtn');

            trueBtn.style.pointerEvents = 'none';
            falseBtn.style.pointerEvents = 'none';

            if (q.answer === true) trueBtn.classList.add('correct-answer');
            else falseBtn.classList.add('correct-answer');

            if (!isCorrect) {
                if (chosen === true) trueBtn.classList.add('wrong-answer');
                else falseBtn.classList.add('wrong-answer');
            }

            const feedbackArea = modal.querySelector('#feedbackArea');
            if (isCorrect) {
                feedbackArea.innerHTML = '<div class="feedback-icon">✅</div><p style="text-align:center;color:#1e7e34;">إجابة صحيحة!</p>';
                createConfetti(modal.querySelector('.quiz-content'));
            } else {
                feedbackArea.innerHTML = '<div class="feedback-icon">❌</div><p style="text-align:center;color:#c5221f;">إجابة خاطئة! الصحيح: ' + (q.answer ? '✓ صح' : '✗ خطأ') + '</p>';
            }

            const checkBtn = modal.querySelector('#checkBtn');
            if (checkBtn) checkBtn.style.display = 'none';
            const prevBtn = modal.querySelector('#prevBtn');
            if (prevBtn) prevBtn.style.display = 'none';

            const isLast = currentQuiz.currentIndex === currentQuiz.questions.length - 1;
            const nextBtn = document.createElement('button');
            nextBtn.className = 'btn-primary';
            if (isLast) {
                nextBtn.textContent = 'إنهاء الاختبار';
                nextBtn.addEventListener('click', finishQuiz);
            } else {
                nextBtn.textContent = 'التالي ⏩';
                nextBtn.addEventListener('click', moveToNextQuestion);
            }
            checkBtn.parentNode.appendChild(nextBtn);
        }

        function moveToNextQuestion() {
            removeQuizModal();
            currentQuiz.currentIndex++;
            currentQuiz.quizDone = false;
            renderQuizModal();
        }

        function prevQuestion() {
            removeQuizModal();
            currentQuiz.currentIndex--;
            currentQuiz.quizDone = false;
            renderQuizModal();
        }

        function finishQuiz() {
            let correct = 0;
            currentQuiz.questions.forEach((q, i) => {
                const chosen = currentQuiz.answers[i];
                if (chosen === q.answer) correct++;
            });
            const total = currentQuiz.questions.length;
            const sectionId = currentQuiz.sectionId;
            cancelQuiz();

            const message = `نتيجتك في هذا القسم: ${correct} / ${total}\n` +
                (correct === total ? '🎉 ممتاز! أحسنت الإجابة على جميع الأسئلة.' :
                 correct >= 3 ? '✅ جيد. تم إكمال القسم.' :
                 '⚠️ يُنصح بمراجعة هذا القسم مرة أخرى.');

            alert(message);

            // دائمًا نكمل القسم حتى لو لم يحصل على الدرجة الكاملة (لأنها أسئلة متابعة)
            markSectionCompleted(sectionId);
            renderMainPage();
        }

        // --- تأثير كونفيتي ---
        function createConfetti(container) {
            const colors = ['#ff0','#f00','#0f0','#00f','#ff00ff','#00ffff'];
            for (let i=0; i<20; i++) {
                const confetti = document.createElement('div');
                confetti.style.position = 'absolute';
                confetti.style.width = '8px';
                confetti.style.height = '8px';
                confetti.style.backgroundColor = colors[Math.floor(Math.random()*colors.length)];
                confetti.style.left = Math.random()*100 + '%';
                confetti.style.top = '-10px';
                confetti.style.borderRadius = '50%';
                confetti.style.animation = `confettiFall ${1+Math.random()}s ease forwards`;
                container.appendChild(confetti);
                setTimeout(() => confetti.remove(), 2000);
            }
        }

        const styleSheet = document.createElement("style");
        styleSheet.textContent = `
            @keyframes confettiFall {
                0% { transform: translateY(0) rotate(0deg); opacity:1; }
                100% { transform: translateY(200px) rotate(720deg); opacity:0; }
            }
        `;
        document.head.appendChild(styleSheet);

        // بدء التطبيق
        if (isWelcomeShown()) {
            renderMainPage();
        } else {
            showWelcome();
        }
    </script>
</body>
</html>

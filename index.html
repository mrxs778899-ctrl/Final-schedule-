<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
    <title>منظم جلسات الدراسة</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            color: #1c1e21;
            min-height: 100vh;
            /* خلفية دراسية جميلة */
            background: url('https://images.unsplash.com/photo-1507842217343-583bb7270b66?ixlib=rb-4.0.3&auto=format&fit=crop&w=1920&q=80') no-repeat center center fixed;
            background-size: cover;
            position: relative;
        }
        /* طبقة شفافة لتوضيح العناصر */
        body::before {
            content: '';
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0, 0, 0, 0.4);
            z-index: -1;
        }
        .container {
            max-width: 500px;
            margin: 0 auto;
            padding: 20px;
            position: relative;
            z-index: 1;
        }
        .card {
            background: rgba(255, 255, 255, 0.92);
            backdrop-filter: blur(12px);
            border-radius: 24px;
            padding: 20px;
            margin-bottom: 16px;
            box-shadow: 0 8px 24px rgba(0,0,0,0.2);
            transition: transform 0.2s;
        }
        h2 { font-size: 1.3rem; margin-bottom: 12px; color: #0d47a1; }
        .user { display: flex; align-items: center; gap: 12px; margin-bottom: 20px; }
        .user img { width: 52px; height: 52px; border-radius: 50%; border: 2px solid #0088cc; }
        .progress-section { margin: 10px 0; }
        .progress-label { display: flex; justify-content: space-between; margin-bottom: 4px; }
        .progress-bar { height: 18px; background: #e0e0e0; border-radius: 9px; overflow: hidden; margin: 6px 0 10px; }
        .progress-fill { height: 100%; background: #0088cc; transition: width 0.4s; }
        .controls { display: flex; align-items: center; gap: 8px; margin-top: 5px; }
        .ctrl-btn {
            width: 36px; height: 36px;
            border-radius: 50%;
            border: none;
            background: #0088cc;
            color: #fff;
            font-size: 1.3rem;
            font-weight: bold;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: background 0.2s, transform 0.1s;
            box-shadow: 0 2px 6px rgba(0,0,0,0.15);
        }
        .ctrl-btn:active { transform: scale(0.9); background: #005f8a; }
        .ctrl-btn.minus { background: #e0e0e0; color: #333; }
        .ctrl-btn.minus:active { background: #bdbdbd; }
        .total-progress { text-align: center; margin: 12px 0; font-weight: bold; }
        .note { text-align: center; font-size: 0.7rem; color: #ddd; margin-top: 16px; text-shadow: 0 1px 3px rgba(0,0,0,0.5); }
        .value { font-weight: bold; color: #0088cc; }
    </style>
</head>
<body>
    <div class="container" id="app"></div>
    <script>
        const tg = window.Telegram.WebApp;
        tg.ready();
        tg.expand();

        const user = tg.initDataUnsafe?.user;
        const userName = user ? (user.first_name || 'مستخدم') : 'مستخدم';

        const TOTAL_THEORETICAL = 7;
        const TOTAL_PRACTICAL = 6;

        async function load() {
            const raw = localStorage.getItem('tma_progress');
            return raw ? JSON.parse(raw) : { theoretical: 4, practical: 0 };
        }
        async function save(d) { localStorage.setItem('tma_progress', JSON.stringify(d)); }

        function render(state) {
            const done = state.theoretical + state.practical;
            const total = TOTAL_THEORETICAL + TOTAL_PRACTICAL;
            const pct = Math.round((done / total) * 100);

            document.getElementById('app').innerHTML = `
                <div class="user">
                    <img src="${user?.photo_url || 'https://ui-avatars.com/api/?name=' + encodeURIComponent(userName) + '&background=0088cc&color=fff'}" alt="">
                    <div>
                        <strong style="font-size:1.1rem;">${userName}</strong>
                        <div style="font-size:0.8rem; opacity:0.8;">@${user?.username || 'لا يوجد'}</div>
                    </div>
                </div>
                <div class="card">
                    <h2>📈 تقدّم الدراسة</h2>
                    <div class="progress-section">
                        <div class="progress-label">
                            <span>📘 نظري</span>
                            <span>${state.theoretical}/${TOTAL_THEORETICAL}</span>
                        </div>
                        <div class="progress-bar">
                            <div class="progress-fill" style="width:${(state.theoretical/TOTAL_THEORETICAL)*100}%"></div>
                        </div>
                        <div class="controls">
                            <button class="ctrl-btn minus" onclick="changeProgress('theoretical', -1)">−</button>
                            <span class="value">${state.theoretical}</span>
                            <button class="ctrl-btn" onclick="changeProgress('theoretical', 1)">+</button>
                        </div>
                    </div>
                    <div class="progress-section">
                        <div class="progress-label">
                            <span>🧪 عملي</span>
                            <span>${state.practical}/${TOTAL_PRACTICAL}</span>
                        </div>
                        <div class="progress-bar">
                            <div class="progress-fill" style="width:${(state.practical/TOTAL_PRACTICAL)*100}%"></div>
                        </div>
                        <div class="controls">
                            <button class="ctrl-btn minus" onclick="changeProgress('practical', -1)">−</button>
                            <span class="value">${state.practical}</span>
                            <button class="ctrl-btn" onclick="changeProgress('practical', 1)">+</button>
                        </div>
                    </div>
                    <div class="total-progress">
                        ${pct}% مكتمل (${done}/${total})
                    </div>
                </div>
                <div class="note">تطبيق تيليجرام المصغر • بدون تسجيل دخول</div>
            `;
        }

        window.changeProgress = async function(type, amount) {
            const data = await load();
            if (type === 'theoretical') {
                data.theoretical = Math.min(Math.max(data.theoretical + amount, 0), TOTAL_THEORETICAL);
            } else if (type === 'practical') {
                data.practical = Math.min(Math.max(data.practical + amount, 0), TOTAL_PRACTICAL);
            }
            await save(data);
            render(data);
        };

        (async ()=>{
            const data = await load();
            render(data);
        })();
    </script>
</body>
</html>
